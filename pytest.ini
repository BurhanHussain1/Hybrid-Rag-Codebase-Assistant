[pytest]
# Only our tests. Without testpaths, pytest walks into repos/ and tries to
# collect the cloned repositories' own test suites — fastapi-users ships a
# test_build.py that calls sys.exit(1) at import time, which crashes collection
# before a single test of ours runs.
testpaths = tests

# Belt and braces for anyone who runs `pytest <path>` explicitly.
norecursedirs = repos venv .venv chroma_db bm25_index models .git __pycache__

addopts = -q --strict-markers
